[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeos"
version = "0.1.0"
description = "Official Python SDK for ForgeOS — the AI-powered developer operating system."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ForgeOS contributors" }]
keywords = ["forgeos", "developer-tools", "code-analysis", "sdk", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies: the client uses only the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/itsshreyasbhardwaj-design/forgeos"
Repository = "https://github.com/itsshreyasbhardwaj-design/forgeos"
Issues = "https://github.com/itsshreyasbhardwaj-design/forgeos/issues"

[tool.hatch.build.targets.wheel]
packages = ["forgeos"]
